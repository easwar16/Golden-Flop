name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Server
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/server/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/goldenflop-server:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/goldenflop-server:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create app directory on VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: mkdir -p ~/goldenflop

      - name: Copy docker-compose to VM
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.production.yml"
          target: "~/goldenflop/"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/goldenflop
            echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

            # Write core env vars (overwrites the top section, preserves manually-added VAULT_KEY_* lines)
            # 1. Save any existing VAULT_KEY_* lines
            grep '^VAULT_KEY_' .env.goldenflop.production > /tmp/vault_keys.tmp 2>/dev/null || true

            # 2. Write fresh env file
            cat <<'ENVEOF' > .env.goldenflop.production
            DOCKERHUB_IMAGE_PREFIX=${{ secrets.DOCKERHUB_USERNAME }}/goldenflop
            IMAGE_TAG=${{ github.sha }}
            PORT=4010
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            REDIS_URL=${{ secrets.REDIS_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN=30d
            SOLANA_NETWORK=${{ secrets.SOLANA_NETWORK }}
            TREASURY_WALLET=${{ secrets.TREASURY_WALLET }}
            SEEKER_MINT=${{ secrets.SEEKER_MINT }}
            VAULT_PRIVATE_KEY=${{ secrets.VAULT_PRIVATE_KEY }}
            CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}
            VAULT_KEY_TABLE_HIGH_A_1=${{ secrets.VAULT_KEY_TABLE_HIGH_A_1 }}
            VAULT_KEY_TABLE_HIGH_A_2=${{ secrets.VAULT_KEY_TABLE_HIGH_A_2 }}
            VAULT_KEY_TABLE_HIGH_A_3=${{ secrets.VAULT_KEY_TABLE_HIGH_A_3 }}
            VAULT_KEY_TABLE_MICRO_A_1=${{ secrets.VAULT_KEY_TABLE_MICRO_A_1 }}
            ENVEOF

            # 3. Strip leading whitespace from heredoc indentation
            sed -i 's/^[[:space:]]*//' .env.goldenflop.production

            # 4. Re-append per-room vault keys
            cat /tmp/vault_keys.tmp >> .env.goldenflop.production 2>/dev/null || true
            rm -f /tmp/vault_keys.tmp

            docker compose -f docker-compose.production.yml --env-file .env.goldenflop.production pull
            docker compose -f docker-compose.production.yml --env-file .env.goldenflop.production up -d --remove-orphans

            docker system prune -af
